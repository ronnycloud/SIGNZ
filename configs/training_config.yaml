# =============================================================================
# MTAN-SLR Training Configuration
# =============================================================================

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"           # Options: adam, adamw, sgd
  scheduler: "cosine_annealing"  # Options: cosine_annealing, step, plateau
  scheduler_params:
    T_max: 50                  # For cosine annealing: period in epochs
    eta_min: 0.00001           # Minimum learning rate
  epochs: 200
  early_stopping_patience: 20
  mixed_precision: true        # Use AMP for faster training on GPU
  gradient_clip_norm: 1.0
  label_smoothing: 0.1

data:
  data_path: "dataset/MP_Data"
  max_sequence_length: 90      # Maximum frames per gesture clip
  min_sequence_length: 10      # Minimum frames (shorter clips are padded)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  num_workers: 0
  pin_memory: true

augmentation:
  enabled: true
  temporal_jitter: true
  temporal_jitter_range: 2     # ±N frames skip/repeat
  spatial_noise: true
  spatial_noise_std: 0.005
  scale_variation: true
  scale_range: [0.9, 1.1]
  mirror: true                 # Swap left/right hands
  speed_variation: true
  speed_range: [0.8, 1.2]

logging:
  log_dir: "runs"
  log_interval: 10             # Log every N batches
  save_best: true
  save_last: true
  checkpoint_dir: "checkpoints"

seed: 42
device: "auto"                 # Options: auto, cuda, cpu
